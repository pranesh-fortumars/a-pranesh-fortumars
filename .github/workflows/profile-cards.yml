name: Refresh animated profile cards

on:
  push:
    paths:
      - "scripts/render_profile_cards.py"
      - ".github/workflows/profile-cards.yml"
      - "data/contributions.json"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install font subsetting tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          python -m pip install --upgrade pip fonttools brotli
          curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ofl/geist/Geist%5Bwght%5D.ttf" -o "$RUNNER_TEMP/Geist.ttf"
          curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ofl/geistmono/GeistMono%5Bwght%5D.ttf" -o "$RUNNER_TEMP/GeistMono.ttf"
      - name: Fetch contribution calendar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: pranesh-fortumars
        run: |
          mkdir -p data
          FROM_DATE="$(date -u -d "12 months ago" +%Y-%m-%d)T00:00:00Z"
          TO_DATE="$(date -u +%Y-%m-%d)T23:59:59Z"
          gh api graphql -f query='query($login:String!,$from:DateTime!,$to:DateTime!){user(login:$login){contributionsCollection(from:$from,to:$to){contributionCalendar{totalContributions weeks{contributionDays{date contributionCount}}}}}}' -F login="$GITHUB_USERNAME" -F from="$FROM_DATE" -F to="$TO_DATE" > data/contributions.json
      - name: Render SVG cards
        env:
          GITHUB_USERNAME: pranesh-fortumars
          PROFILE_FONT_FILE: ${{ runner.temp }}/Geist.ttf
          PROFILE_MONO_FONT_FILE: ${{ runner.temp }}/GeistMono.ttf
        run: python scripts/render_profile_cards.py
      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/*.svg data/contributions.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh animated profile cards"
            git push
          fi
